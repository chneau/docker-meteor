name: Publish all releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        release:
          - "3.5"
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --build-arg RELEASE=${{ matrix.release }} -t test-meteor .

      - name: Run smoke tests
        run: ./test.sh test-meteor

  publish-all:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        release:
          - "3.5"
          - "3.4.1"
          - "3.4"
          - "3.3.2"
          - "3.3.1"
          - "3.3"
          - "3.2"
          - "3.1.2"
          - "3.1.1"
          - "3.1"
          - "3.0.4"
          - "3.0.3"
          - "3.0.2"
          - "3.0.1"
          - "3.0"
          - "2.16"
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ (matrix.release != '2.16' && matrix.release != '3.0') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          build-args: RELEASE=${{ matrix.release }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/meteor:${{ matrix.release }}
            ${{ matrix.release == '3.5' && format('ghcr.io/{0}/meteor:latest', github.repository_owner) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

