name: Publish all releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
      latest: ${{ steps.releases.outputs.latest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Meteor releases
        id: releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/meteor-releases.mjs

  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --build-arg RELEASE=${{ needs.prepare.outputs.latest }} -t test-meteor .

      - name: Run smoke tests
        run: ./test.sh test-meteor

  publish-all:
    needs:
      - prepare
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.multiarch && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          build-args: RELEASE=${{ matrix.release }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/meteor:${{ matrix.release }}
            ${{ matrix.latest && format('ghcr.io/{0}/meteor:latest', github.repository_owner) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

