name: Publish single release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Meteor release version (e.g. 3.5)"
        type: string
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --build-arg RELEASE=${{ inputs.release }} -t test-meteor .

      - name: Run smoke tests
        run: ./test.sh test-meteor

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: RELEASE=${{ inputs.release }}
          tags: ghcr.io/${{ github.repository_owner }}/meteor:${{ inputs.release }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

